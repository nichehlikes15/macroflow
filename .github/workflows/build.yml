name: Build

# Builds MacroFlow on macOS and Windows for every push and pull request,
# runs the unit tests, and uploads the built app so you can download it.

on:
  push:
  pull_request:
  workflow_dispatch:

# Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) also
# publishes a GitHub Release with both downloads. MacroFlow's update check offers
# it to everyone on an older version.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: macroflow-macos-arm64
            exe: macroflow
          - name: Windows (x64)
            os: windows-latest
            artifact: macroflow-windows-x64
            exe: macroflow.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Collect build
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            # A real MacroFlow.app with its icon and all four helpers, zipped so
            # the download keeps the app's structure and signature.
            ./scripts/bundle-macos.sh
            ditto -c -k --keepParent dist/MacroFlow.app dist/MacroFlow-macos.zip
            rm -rf dist/MacroFlow.app
          else
            # The .exe has the app icon built in (build.rs).
            cp "target/release/${{ matrix.exe }}" dist/
          fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Cargo.toml version $version. Bump the version first, so the update check compares the right numbers."
            exit 1
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MacroFlow-macos.zip
            dist/macroflow.exe
          fail_on_unmatched_files: false
