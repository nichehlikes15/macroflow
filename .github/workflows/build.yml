name: Build

# Builds MacroFlow on macOS and Windows for every push and pull request,
# runs the unit tests, and uploads the built app so you can download it.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: macroflow-macos-arm64
            exe: macroflow
          - name: Windows (x64)
            os: windows-latest
            artifact: macroflow-windows-x64
            exe: macroflow.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Collect build
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.exe }}" dist/
          # The macOS text reader helper is built next to the other build outputs.
          if [ "${{ runner.os }}" = "macOS" ]; then
            helper=$(find target/release/build -name macroflow-ocr -type f | head -n 1)
            if [ -n "$helper" ]; then cp "$helper" dist/; fi
          fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
