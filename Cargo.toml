[package]
name = "macroflow"
version = "0.1.0"
edition = "2021"
description = "A flowchart-style smart macro builder for macOS and Windows, built with GPUI"
publish = false

[dependencies]
# UI framework from Zed. On macOS, `runtime_shaders` means you don't need the full Xcode app
# (the Xcode Command Line Tools are enough). It has no effect on Windows.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Sends mouse and keyboard input during playback.
enigo = "0.6.1"
# Reads mouse and keyboard state while recording.
device_query = "4.0.1"
# Takes screenshots so "Find image" steps work.
xcap = "0.9.10"
image = { version = "0.25", default-features = false, features = ["png"] }
# Lets Read text steps compare against a regular expression.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Webhook steps and the Discord bot: plain blocking HTTPS (rustls with ring, no C toolchain).
ureq = { version = "=3.5.2", features = ["json"] }
# The Discord bot's live connection (Discord's "gateway" is a websocket).
tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }

# Image search is CPU-heavy. This keeps `cargo run` responsive while still compiling quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

# macOS only: show MacroFlow's icon in the Dock (the same version GPUI uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"

# Windows only: build the app icon into the .exe (the same version GPUI uses).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"

# Windows only: maximise / restore from MacroFlow's own title bar buttons.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# The same version GPUI uses, to get MacroFlow's own window handle.
raw-window-handle = "0.6"
